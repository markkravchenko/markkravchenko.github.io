<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  CLIENT GALLERY TEMPLATE
  ========================
  1. Duplicate this file and rename it, e.g. clients/smith-wedding-2024.html
  2. Edit the three variables below: CLIENT_NAME, CLIENT_DATE, CLIENT_DESC
  3. Edit PHOTOS array with your image filenames
  4. Upload the photos to clients/smith-wedding-2024/ (matching folder)
  5. Link to it from the Clients page in index.html
  6. Send the URL to your client — only people with the link can find it
-->
<title>Your Gallery — Mark Kravchenko</title>
<!-- Helvetica Neue used throughout — no external font needed -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --ink: #1a1a1a; --ink-muted: #999999;
    --ink-faint: #dddddd; --accent: #1a1a1a; --border: rgba(0,0,0,0.09);
  }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 13px; }

  header {
    padding: 3rem 2.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem;
  }
  .header-left {}
  .header-eyebrow {
    font-size: 10px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-muted); margin-bottom: 0.5rem;
  }
  .header-name {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: clamp(28px, 4vw, 48px); font-weight: 700;
    line-height: 1.05; letter-spacing: -0.02em;
  }
  .header-meta { margin-top: 0.5rem; color: var(--ink-muted); font-size: 13px; font-weight: 300; }
  .dl-all-btn {
    flex-shrink: 0;
    padding: 11px 24px;
    border: 1px solid var(--ink);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink); background: none; cursor: pointer;
    transition: all 0.18s; text-decoration: none; display: inline-block;
  }
  .dl-all-btn:hover { background: var(--ink); color: var(--bg); }

  .masonry { columns: 3; column-gap: 3px; padding: 3px; }
  .masonry-item {
    break-inside: avoid; margin-bottom: 3px;
    position: relative; overflow: hidden; cursor: pointer;
  }
  .masonry-item img { width: 100%; display: block; transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94); }
  .masonry-item:hover img { transform: scale(1.03); }
  .item-overlay {
    position: absolute; inset: 0;
    background: rgba(10,11,11,0.45);
    opacity: 0; transition: opacity 0.25s;
    display: flex; align-items: center; justify-content: center;
  }
  .masonry-item:hover .item-overlay { opacity: 1; }
  .dl-icon { color: #fff; font-size: 22px; }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(255,255,255,0.97);
    align-items: center; justify-content: center;
    padding: 2rem; backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; }
  .modal-img-wrap { max-width: min(90vw, 1100px); max-height: 90vh; position: relative; }
  .modal-img-wrap img { max-width: 100%; max-height: 82vh; object-fit: contain; display: block; }
  .modal-caption { margin-top: 0.75rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .modal-caption-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; color: var(--ink); }
  .modal-dl-btn {
    padding: 8px 18px; border: 1px solid var(--ink-faint);
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-muted);
    text-decoration: none; transition: all 0.18s; white-space: nowrap;
  }
  .modal-dl-btn:hover { border-color: var(--ink); color: var(--ink); }
  .modal-close { position: fixed; top: 1.5rem; right: 1.5rem; background: none; border: none; font-size: 22px; color: var(--ink-muted); cursor: pointer; transition: color 0.18s; }
  .modal-close:hover { color: var(--ink); }
  .modal-prev, .modal-next { position: fixed; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 28px; color: var(--ink-muted); cursor: pointer; padding: 1rem; transition: color 0.18s; }
  .modal-prev { left: 1rem; } .modal-next { right: 1rem; }
  .modal-prev:hover, .modal-next:hover { color: var(--ink); }

  footer { border-top: 1px solid var(--border); padding: 1.25rem 2.5rem; display: flex; justify-content: space-between; }
  .footer-copy { font-size: 11px; color: var(--ink-faint); }

  @media (max-width: 900px) { .masonry { columns: 2; } }
  @media (max-width: 560px) {
    .masonry { columns: 1; }
    header { flex-direction: column; align-items: flex-start; padding: 2rem 1.25rem 1.5rem; }
    .masonry { padding: 2px; } .masonry-item { margin-bottom: 2px; }
    footer { padding: 1.25rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <p class="header-eyebrow">Private Gallery — Mark Kravchenko</p>
    <h1 class="header-name" id="client-name">Client Name</h1>
    <p class="header-meta" id="client-meta">Date · Location</p>
  </div>
  <a class="dl-all-btn" id="dl-all-btn" href="#" onclick="downloadAll()">↓ Download All</a>
</header>

<div class="masonry" id="gallery"></div>

<div class="modal-overlay" id="modal" onclick="handleModalClick(event)">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <button class="modal-prev"  onclick="modalNav(-1)">&#8592;</button>
  <button class="modal-next"  onclick="modalNav(1)">&#8594;</button>
  <div class="modal-img-wrap">
    <img id="modal-img" src="" alt="">
    <div class="modal-caption">
      <span class="modal-caption-title" id="modal-title"></span>
      <a class="modal-dl-btn" id="modal-dl" href="#" download>↓ Download</a>
    </div>
  </div>
</div>

<footer>
  <span class="footer-copy">© 2026 Mark Kravchenko Photography — Private client gallery</span>
</footer>

<script>
/*
================================================================
  HOW TO SET UP THIS CLIENT GALLERY
  ----------------------------------------------------------------
  1. Edit CLIENT_NAME, CLIENT_DATE, CLIENT_DESC below
  2. Add an entry to PHOTOS for every image
     { src: 'clients/your-folder/filename.jpg', title: 'optional caption' }
  3. Save as clients/your-client-name.html
  4. Upload photos to clients/your-folder/ in GitHub
  5. Send the URL to your client
================================================================
*/

  var CLIENT_NAME = 'Smith Wedding';
  var CLIENT_DATE = 'June 2024 · Cape Breton, NS';
  var CLIENT_DESC = '';

  var PHOTOS = [
    { src: 'clients/smith-wedding-2024/DSC001.jpg', title: 'Ceremony' },
    { src: 'clients/smith-wedding-2024/DSC002.jpg', title: 'Reception' },
    { src: 'clients/smith-wedding-2024/DSC003.jpg', title: 'First dance' },
    // Add more photos here — copy/paste the line above
  ];

  /* ── INIT ── */
  document.getElementById('client-name').textContent = CLIENT_NAME;
  document.getElementById('client-meta').textContent = CLIENT_DATE;
  document.title = CLIENT_NAME + ' — Mark Kravchenko';

  var gallery = document.getElementById('gallery');
  gallery.innerHTML = PHOTOS.map(function(p, i) {
    return '<div class="masonry-item" onclick="openModal(' + i + ')">' +
      '<img src="' + p.src + '" alt="' + (p.title || '') + '" loading="lazy">' +
      '<div class="item-overlay"><span class="dl-icon">↓</span></div>' +
      '</div>';
  }).join('');

  /* ── MODAL ── */
  var activeIndex = 0;

  function openModal(i) {
    activeIndex = i;
    showPhoto();
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showPhoto() {
    var p = PHOTOS[activeIndex];
    document.getElementById('modal-img').src = p.src;
    document.getElementById('modal-img').alt = p.title || '';
    document.getElementById('modal-title').textContent = p.title || '';
    document.getElementById('modal-dl').href = p.src;
    document.getElementById('modal-dl').download = p.src.split('/').pop();
  }

  function modalNav(dir) {
    activeIndex = (activeIndex + dir + PHOTOS.length) % PHOTOS.length;
    showPhoto();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleModalClick(e) {
    if (e.target === document.getElementById('modal')) closeModal();
  }

  function downloadAll() {
    // Opens each photo in a new tab for saving — simplest approach without a backend
    PHOTOS.forEach(function(p, i) {
      setTimeout(function() {
        var a = document.createElement('a');
        a.href = p.src; a.download = p.src.split('/').pop();
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }, i * 300);
    });
  }

  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('modal').classList.contains('open')) return;
    if (e.key === 'Escape')     closeModal();
    if (e.key === 'ArrowLeft')  modalNav(-1);
    if (e.key === 'ArrowRight') modalNav(1);
  });
</script>
</body>
</html>
